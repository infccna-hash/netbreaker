        initial_build: R1(Fa0/0)→SW1(Et0/0) · PC1(eth0)→SW1(Et0/1) · SW1(Et0/2)→SW2(Et0/1) · KALI(eth0)→SW1(Et0/3) · SRV1(e...
      </text>
    </svg>
