services:
  api:
    build: .
    container_name: netbreaker-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./keys:/app/keys:ro
    expose:
      - "8080"

  postgres:
    image: postgres:16-alpine
    container_name: netbreaker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: netbreaker
      POSTGRES_USER: netbreaker
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbreaker"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: netbreaker-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"

  # Edge: builds the React SPA, serves it, terminates TLS, and proxies /api → api.
  web:
    build:
      context: ./frontend
    container_name: netbreaker-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # ── CI test runner ───────────────────────────────────────────
  # Runs integration tests (reaper, progress eligibility, etc.)
  # that need a real Postgres.  Launched separately via:
  #   docker compose run --rm test
  # Requires a .env with DB_PASSWORD set.
  test:
    image: golang:1.22-alpine
    container_name: netbreaker-test
    profiles: ["test"]
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache git gcc musl-dev curl &&
        curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz &&
        mv migrate /usr/local/bin/ &&
        migrate -path migrations -database \"$$TEST_DATABASE_URL\" up &&
        go test -race -count=1 ./internal/... -timeout 120s
      "
    environment:
      TEST_DATABASE_URL: postgres://netbreaker:${DB_PASSWORD}@postgres:5432/netbreaker?sslmode=disable
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
  caddy_data:
  caddy_config:
